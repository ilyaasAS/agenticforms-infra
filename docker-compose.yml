services:
  # Base de données Relationnelle
  db:
    image: mysql:8.0.39
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Base de données NoSQL
  mongo:
    image: mongo:7.0
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  # SMTP de dev (capture des e-mails — UI http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.22.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # Backend — secrets lus depuis .env (non commité), pas re-déclarés en clair ici.
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"
    env_file:
      - .env
    environment:
      # Profil durci par défaut (override possible via .env)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # En local HTTP laisser false ; true dès qu'un TLS termine devant l'API
      COOKIE_FORCE_SECURE: ${COOKIE_FORCE_SECURE:-false}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      OAUTH2_FRONTEND_REDIRECT_URI: ${OAUTH2_FRONTEND_REDIRECT_URI:-http://localhost:5173/oauth2/redirect}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-common}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@agenticforms.com}
      RESET_PASSWORD_URL: ${RESET_PASSWORD_URL:-http://localhost:5173/reset-password}
      VERIFY_EMAIL_URL: ${VERIFY_EMAIL_URL:-http://localhost:5173/verify-email}
      MEDIA_STORAGE_DIR: ${MEDIA_STORAGE_DIR:-/data/media}
      # Secrets (JWT_SECRET, DB_*, MONGO_*, OAuth, SPRING_MAIL_PASSWORD) :
      # uniquement via env_file (.env), jamais listés en clair dans ce fichier.
    volumes:
      - media_data:/data/media
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || curl -fsS http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Frontend
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8080}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_UNSPLASH_ACCESS_KEY: ${VITE_UNSPLASH_ACCESS_KEY:-}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
  mongo_data:
  media_data:
